name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gameboxd
          POSTGRES_PASSWORD: gameboxd
          POSTGRES_DB: gameboxd
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gameboxd -d gameboxd"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://gameboxd:gameboxd@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --test backend -- --ignored --skip launch_backup_restore
      - name: Restore drill with matching PostgreSQL 17 clients
        run: |
          mkdir -p /tmp/gameboxd-pg-clients
          cat > /tmp/gameboxd-pg-clients/client <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -i --network host --user "$(id -u):$(id -g)" \
            --mount type=bind,src=/tmp,dst=/tmp \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \
            postgres:17 "${0##*/}" "$@"
          SH
          chmod +x /tmp/gameboxd-pg-clients/client
          for tool in pg_dump pg_restore psql createdb dropdb; do
            ln -s client "/tmp/gameboxd-pg-clients/$tool"
          done
          PATH="/tmp/gameboxd-pg-clients:$PATH" cargo test --locked --test backend launch_backup_restore -- --ignored
      - name: Local TLS proxy template smoke test
        run: python3 scripts/check-proxy.py
      # `cargo test` regenerates contract/types from the Rust structs. A change
      # to a wire struct without regenerating leaves the working tree dirty
      # here, which is the whole drift guarantee: the generated TypeScript
      # cannot fall behind the types that actually serialize the responses.
      - name: Generated contract types are up to date
        run: git diff --exit-code -- contract/types
      # The generated types and both hand-written clients have to be internally
      # consistent and strict-clean before a frontend depends on them. Nothing
      # in the Rust suite can see a TypeScript type error: the readiness review
      # found `ApiError.code` typed as a union that could not name the codes the
      # route actually returns, which made the sign-out branch every screen
      # needs a comparison the compiler rejected. That was invisible to CI until
      # this step existed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contract typechecks under --strict
        run: npx -y -p typescript@7.0.2 tsc -p contract
