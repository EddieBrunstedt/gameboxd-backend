services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gameboxd
      POSTGRES_PASSWORD: gameboxd
      POSTGRES_DB: gameboxd
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameboxd -d gameboxd"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
